name: React CI

on:
  pull_request:
    branches: [main, develop] # Runs on PRs to main or develop

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" # Use your Node version (check package.json or node -v)
          cache: "npm"
      - name: Install dependencies
        run: npm ci # Faster than npm install
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build project
        run: npm run build # Ensures Vite build works
